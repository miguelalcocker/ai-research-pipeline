apis:
  arxiv:
    base_url: http://export.arxiv.org/api/query
    enabled: false
    rate_limit_delay: 3.0
  openalex:
    base_url: https://api.openalex.org
    email: your.email@example.com
    max_retries: 3
    rate_limit_delay: 0.1
    timeout: 30
  semantic_scholar:
    base_url: https://api.semanticscholar.org/graph/v1
    enabled: false
    rate_limit_delay: 1.0
data_collection:
  core_concepts:
  - artificial intelligence
  - machine learning
  - deep learning
  - neural network
  - graph neural network
  - reinforcement learning
  - natural language processing
  - computer vision
  - generative ai
  - transformer
  - federated learning
  - explainable ai
  - quantum machine learning
  - neural architecture search
  end_year: 2024
  max_papers: 15000
  min_papers: 10000
  start_year: 2019
geocoding:
  cache_file: geocode_cache.json
  enabled: true
output:
  csv_separator: ','
  date_format: '%Y-%m-%d'
  encoding: utf-8
  max_abstract_length: 500
quality:
  breakthrough_paper_percentile: 95
  min_abstract_length: 100
  min_title_length: 10
  normalize_citations_by_year: true
  prolific_author_threshold: 10
random_seed: 42
